<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Factsheet — Sections</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app-shell">
  <div class="topbar">
    <div style="display:flex; align-items:center; gap:14px">
      <a href="#" id="details-back" aria-label="Back to header" style="display:flex; align-items:center; color:var(--text-muted)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
      </a>
      <div style="width:1px; height:22px; background:var(--border)"></div>
      <div>
        <div class="crumbs">Factsheets / <span id="details-code-crumb">—</span> / Sections</div>
        <div class="screen-title" id="details-title-crumb">—</div>
      </div>
    </div>
    <div style="display:flex; align-items:center; gap:10px">
      <span style="font-size:12px; color:var(--text-faint)" id="section-count-label">0 sections</span>
      <a href="list.html" class="btn" id="details-exit">Save &amp; exit</a>
      <button class="btn btn-primary" id="btn-generate">Generate page &amp; PDF</button>
    </div>
  </div>

  <div class="page-body" style="display:grid; grid-template-columns:320px 1fr; gap:20px">
    <div style="display:flex; flex-direction:column; gap:12px">
      <div style="display:flex; align-items:center; justify-content:space-between">
        <div style="font-size:12px; font-weight:700; color:var(--text-muted); text-transform:uppercase; letter-spacing:.03em">Sections</div>
        <button class="btn btn-sm" id="add-section" style="color:var(--primary); border-color:var(--primary)">+ Add section</button>
      </div>
      <div class="card" id="sections-list" style="overflow:hidden"></div>
      <div class="hint">Click a section to edit it. Set the Sort order field to change its position.</div>
    </div>

    <div class="card" style="padding:22px 24px; display:flex; flex-direction:column; gap:18px" id="editor-panel">
      <div style="display:flex; align-items:center; justify-content:space-between; padding-bottom:14px; border-bottom:1px solid var(--border)">
        <div style="font-size:15px; font-weight:600">Edit section</div>
        <div style="display:flex; gap:8px">
          <button class="btn btn-sm" id="delete-section" style="color:var(--danger)">Delete</button>
          <button class="btn btn-sm btn-primary" id="save-section">Save section</button>
        </div>
      </div>

      <div class="field-grid">
        <div>
          <label class="label" for="d-type">Section type</label>
          <select id="d-type">
            <option>Overview</option>
            <option>Specifications</option>
            <option>Key features</option>
            <option>Gallery</option>
            <option>Compliance &amp; certifications</option>
            <option>Downloads</option>
          </select>
        </div>
        <div>
          <label class="label" for="d-order">Sort order</label>
          <input id="d-order" type="number" min="1">
        </div>
      </div>

      <div>
        <label class="label">Content</label>
        <div style="border:1px solid var(--border-strong); border-radius:2px; overflow:hidden">
          <div class="rte-toolbar" role="toolbar" aria-label="Formatting">
            <select id="rte-block" aria-label="Paragraph style" style="height:28px; width:auto; border:1px solid var(--border-strong); border-radius:3px; font-size:12px; margin-right:6px">
              <option value="p">Paragraph</option>
              <option value="h2">Heading 1</option>
              <option value="h3">Heading 2</option>
              <option value="h4">Heading 3</option>
            </select>
            <button type="button" class="tb-btn" data-cmd="bold" aria-label="Bold" style="font-weight:800; font-size:14px">B</button>
            <button type="button" class="tb-btn" data-cmd="italic" aria-label="Italic" style="font-style:italic; font-size:14px">I</button>
            <button type="button" class="tb-btn" data-cmd="underline" aria-label="Underline" style="text-decoration:underline; font-size:14px">U</button>
            <div style="width:1px; height:20px; background:var(--border); margin:0 4px"></div>
            <button type="button" class="tb-btn" data-cmd="insertUnorderedList" aria-label="Bulleted list">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/><path d="M9 6h11M9 12h11M9 18h11"/></svg>
            </button>
            <button type="button" class="tb-btn" data-cmd="insertOrderedList" aria-label="Numbered list">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6h1M4 10h1.5M4 14h1.5M4 18h1"/></svg>
            </button>
            <div style="width:1px; height:20px; background:var(--border); margin:0 4px"></div>
            <button type="button" class="tb-btn" id="rte-link" aria-label="Insert link">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>
            </button>
            <button type="button" class="tb-btn" id="rte-image" aria-label="Insert image">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
            </button>
            <button type="button" class="tb-btn" id="rte-table" aria-label="Insert table">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="1"/><path d="M3 10h18M3 16h18M9 4v16"/></svg>
            </button>
            <div style="width:1px; height:20px; background:var(--border); margin:0 4px"></div>
            <button type="button" class="tb-btn" data-cmd="undo" aria-label="Undo">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-15-6.7L3 13"/></svg>
            </button>
            <button type="button" class="tb-btn" data-cmd="redo" aria-label="Redo">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 7v6h-6"/><path d="M3 17a9 9 0 0 1 15-6.7L21 13"/></svg>
            </button>
          </div>
          <div class="rte-content" id="rte-area" contenteditable="true" aria-label="Section content"></div>
        </div>
        <div class="hint">Try it: select text and hit Bold/Italic, or use the link/image/table buttons. This is a real contenteditable region.</div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="iframe-resize.js"></script>
<script src="data.js"></script>
<script>
(function () {
  "use strict";
  var Store = window.FactsheetStore;
  var data = Store.load();
  var params = new URLSearchParams(window.location.search);
  var id = params.get("id");

  var fs = null;
  for (var i = 0; i < data.length; i++) { if (data[i].id === id) { fs = data[i]; break; } }
  if (!fs) { window.location.href = "list.html"; return; }
  if (fs.sections.length === 0) {
    fs.sections.push(Store.makeSection(1, "Overview", "Overview", "<p>Start writing this section…</p>"));
    Store.save(data);
  }

  document.getElementById("details-back").addEventListener("click", function (e) {
    e.preventDefault();
    window.location.href = "form.html?id=" + encodeURIComponent(fs.id);
  });

  document.getElementById("details-code-crumb").textContent = fs.code || "—";
  document.getElementById("details-title-crumb").textContent = fs.title || "Untitled factsheet";

  var toastEl = document.getElementById("toast");
  var toastTimer = null;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove("show"); }, 1800);
  }

  var activeSectionId = fs.sections[0].id;
  var dOrder = document.getElementById("d-order");
  var dType = document.getElementById("d-type");
  var rteArea = document.getElementById("rte-area");

  function activeSection() {
    for (var i = 0; i < fs.sections.length; i++) { if (fs.sections[i].id === activeSectionId) return fs.sections[i]; }
    return null;
  }

  function loadSectionIntoEditor() {
    var s = activeSection();
    if (!s) { document.getElementById("editor-panel").style.display = "none"; return; }
    document.getElementById("editor-panel").style.display = "flex";
    dOrder.value = s.order;
    dType.value = s.type;
    rteArea.innerHTML = s.html;
  }

  function saveEditorIntoSection() {
    var s = activeSection(); if (!s) return;
    s.title = dType.value;
    s.order = parseInt(dOrder.value, 10) || s.order;
    s.type = dType.value;
    s.html = rteArea.innerHTML;
    Store.save(data);
  }

  function renderSectionsList() {
    fs.sections.sort(function (a, b) { return a.order - b.order; });
    var wrap = document.getElementById("sections-list");
    wrap.innerHTML = "";
    document.getElementById("section-count-label").textContent = fs.sections.length + " sections";
    fs.sections.forEach(function (s) {
      var row = document.createElement("button");
      row.type = "button";
      row.className = "section-row" + (s.id === activeSectionId ? " active" : "");
      var preview = s.html.replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim();
      row.innerHTML =
        '<span class="order-chip">' + s.order + '</span>' +
        '<span style="flex:1; min-width:0; text-align:left">' +
          '<span style="display:block; font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis">' + Store.escapeHtml(s.type) + '</span>' +
          '<span style="display:block; font-size:11px; color:var(--text-faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis">' + Store.escapeHtml(preview || "Empty section") + '</span>' +
        '</span>';
      row.addEventListener("click", function (ev) {
        saveEditorIntoSection();
        activeSectionId = s.id;
        renderSectionsList();
        loadSectionIntoEditor();
      });
      wrap.appendChild(row);
    });
  }

  dType.addEventListener("change", function () { var s = activeSection(); if (s) { s.type = dType.value; s.title = dType.value; Store.save(data); renderSectionsList(); } });
  dOrder.addEventListener("change", function () { var s = activeSection(); if (s) { s.order = parseInt(dOrder.value, 10) || s.order; Store.save(data); renderSectionsList(); } });
  rteArea.addEventListener("input", function () { var s = activeSection(); if (s) { s.html = rteArea.innerHTML; Store.save(data); } });

  document.getElementById("add-section").addEventListener("click", function () {
    saveEditorIntoSection();
    var maxOrder = fs.sections.reduce(function (m, s) { return Math.max(m, s.order); }, 0);
    var s = Store.makeSection(maxOrder + 1, "Overview", "Overview", "<p>Start writing this section…</p>");
    fs.sections.push(s);
    activeSectionId = s.id;
    Store.save(data);
    renderSectionsList();
    loadSectionIntoEditor();
    dType.focus();
  });

  document.getElementById("delete-section").addEventListener("click", function () {
    var s = activeSection();
    if (!s) return;
    if (fs.sections.length === 1) { toast("A factsheet needs at least one section"); return; }
    fs.sections = fs.sections.filter(function (x) { return x.id !== s.id; });
    activeSectionId = fs.sections[0].id;
    Store.save(data);
    renderSectionsList();
    loadSectionIntoEditor();
    toast("Section deleted");
  });

  document.getElementById("save-section").addEventListener("click", function () {
    saveEditorIntoSection();
    renderSectionsList();
    toast("Section saved");
  });

  document.getElementById("details-exit").addEventListener("click", function () { saveEditorIntoSection(); });

  document.getElementById("btn-generate").addEventListener("click", function () {
    saveEditorIntoSection();
    fs.generatedPageUrl = "/sites/schindler/pages/" + (fs.code || "untitled") + ".aspx";
    fs.generatedPdfUrl = "/factsheets/" + (fs.code || "untitled") + ".pdf";
    fs.status = "Published";
    Store.save(data);
    toast("Flow triggered — page and PDF generated");
  });

  document.querySelectorAll(".tb-btn[data-cmd]").forEach(function (btn) {
    btn.addEventListener("mousedown", function (e) { e.preventDefault(); });
    btn.addEventListener("click", function () { rteArea.focus(); document.execCommand(btn.dataset.cmd, false, null); });
  });
  document.getElementById("rte-block").addEventListener("change", function (e) {
    rteArea.focus(); document.execCommand("formatBlock", false, e.target.value);
  });
  document.getElementById("rte-link").addEventListener("click", function () {
    var url = prompt("Link URL:", "https://");
    if (!url) return;
    rteArea.focus(); document.execCommand("createLink", false, url);
  });
  document.getElementById("rte-image").addEventListener("click", function () {
    var url = prompt("Image URL (paste a link):", "https://");
    if (!url) return;
    rteArea.focus(); document.execCommand("insertImage", false, url);
  });
  document.getElementById("rte-table").addEventListener("click", function () {
    var rows = parseInt(prompt("Rows:", "2"), 10) || 2;
    var cols = parseInt(prompt("Columns:", "2"), 10) || 2;
    var html = "<table>";
    for (var r = 0; r < rows; r++) {
      html += "<tr>";
      for (var c = 0; c < cols; c++) { html += "<td>Cell</td>"; }
      html += "</tr>";
    }
    html += "</table><p><br></p>";
    rteArea.focus(); document.execCommand("insertHTML", false, html);
  });

  renderSectionsList();
  loadSectionIntoEditor();
})();
</script>
</body>
</html>
